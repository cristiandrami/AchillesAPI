resources:
- name: resource
  create: POST /projects
  read: GET /projects/{project_ref}
  delete: DELETE /projects/{project_ref}
  identity: admin
  body:
    label: temporary-resource
  marker_field: label
  marker_pointer: /label
  id_pointer: /id
  read_id_pointer: /id
  path_values:
    project_ref: ${resource.id}
  access:
  - identity: other
    expected: deny
