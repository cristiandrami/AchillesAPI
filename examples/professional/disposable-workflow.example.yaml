    read:
      operation: 'GET /v2/assets/{asset_ref}'
      identity: owner
      id_parameter: asset_ref
      id_pointer: '/asset_ref'
      marker_pointer: '/label'
    access:
      - identity: other
        expected: deny
        category: BOLA
    restricted_response_fields:
