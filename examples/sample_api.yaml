openapi: 3.0.3
info:
  title: AchillesAPI Demo Service
  version: 1.0.0
  description: A deliberately small API contract for parser development.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: User identifier
        schema:
          type: integer
    get:
      operationId: getUser
      summary: Retrieve a user
      responses:
        '200':
          description: User found
    patch:
      operationId: updateUser
      summary: Update a user
      parameters:
        - name: fields
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
      responses:
        '200':
          description: User updated
  /users/{userId}/orders:
    parameters:
      - name: userId
        in: path
        required: true
        description: Owner user identifier
        schema:
          type: integer
    get:
      operationId: getUserOrders
      summary: Retrieve a user's orders
      responses:
        '200':
          description: Orders retrieved
  /admin/users:
    get:
      operationId: getAllUsers
      summary: Retrieve all users (admin)
      security: []
      responses:
        '200':
          description: Users retrieved
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
