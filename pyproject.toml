[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "achillesapi"
version = "0.53.0"
description = "Local-first, AI-assisted API security assessment framework"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "AchillesAPI contributors" }]
dependencies = [
  "typer>=0.12,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "openapi-spec-validator>=0.7,<1.0",
  "networkx>=3.3,<4.0",
]

[project.optional-dependencies]
pdf = ["reportlab>=4.0,<5.0"]
dashboard = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0", "python-multipart>=0.0.12,<1.0", "reportlab>=4.0,<5.0"]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<2.0",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.scripts]
achillesapi = "achillesapi.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/achillesapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

